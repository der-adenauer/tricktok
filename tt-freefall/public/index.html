<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Matter.js - Konstant fallende Bilder (keine Buttons, kein Boden)</title>
  <style>
    /* Vollbild-Layout */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* kein Scrollen */
      background: #fafafa;
      font-family: sans-serif;
    }
    /* Canvas, wird per JS angelegt */
    #worldCanvas {
      display: block;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <!-- Matter.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- Haupt-Skript -->
  <script src="app.js"></script>
</body>
</html>
